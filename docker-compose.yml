services:
  db:
    image: postgres:16-alpine
    container_name: nk_suggestions_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: suggestions
      POSTGRES_PASSWORD: suggestions
      POSTGRES_DB: suggestions
    ports:
      - "5432:5432"
    volumes:
      - nk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suggestions -d suggestions"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nk_pgdata:
