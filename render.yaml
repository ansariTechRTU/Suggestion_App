# Render blueprint — one web service. The database is Supabase Postgres, not a
# Render-managed database, so DATABASE_URL is pasted in by hand after the first
# deploy (Render dashboard -> service -> Environment).
#
# Push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
#
# Single service on purpose: Express serves the built React app, so there is one
# origin, the session cookie stays first-party, and there is no CORS to tune.

services:
  - type: web
    name: novikontas-suggestions
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health

    # NODE_ENV=production (set below, for the running app) makes pnpm skip
    # devDependencies during install — which breaks the build, since `vite`
    # (web) and other build-only tools live there. Override it for install only.
    buildCommand: corepack enable && NODE_ENV=development pnpm install --no-frozen-lockfile && pnpm --filter web build
    # release: prisma generate → db push → raw.sql → seed. All idempotent,
    # so a restart or redeploy is safe and will not duplicate data.
    startCommand: pnpm --filter api release && pnpm --filter api start

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Supabase project -> "Connect" button -> ORMs / Prisma tab gives you
      # both of these ready-made.
      - key: DATABASE_URL   # pooled, pgbouncer transaction mode, port 6543
        sync: false
      - key: DIRECT_URL     # unpooled, session mode, port 5432 — db push/migrate only
        sync: false

      - key: NODE_ENV
        value: production

      # One service serves both halves.
      - key: SERVE_WEB
        value: "true"

      # Comma-separated. Leave blank to let any Google account sign in; set
      # once ready to restrict to your organisation's domain(s).
      - key: ALLOWED_EMAIL_DOMAINS
        value: ""

      - key: TIMEZONE
        value: Europe/Riga

      - key: SESSION_SECRET
        generateValue: true
      - key: UNSUBSCRIBE_SECRET
        generateValue: true

      - key: MAIL_FROM
        value: Novikontas Suggestions <suggestions@novikontas.org>

      # No Resend account needed until you want real email.
      - key: MAIL_DRY_RUN
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false

      # Required — Google Cloud Console -> Credentials -> OAuth client ID.
      # Authorised redirect URI: https://YOUR-RENDER-URL/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_HOSTED_DOMAIN
        value: ""
